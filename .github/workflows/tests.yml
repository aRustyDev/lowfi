name: Tests

on:
  workflow_dispatch:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  native:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            features: mpris,scrape,extra-audio-formats
          - os: windows-latest
            features: media-controls,scrape,extra-audio-formats
          - os: macos-latest
            features: scrape,extra-audio-formats
    steps:
      - uses: actions/checkout@v5
      - name: Install ALSA development headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Check formatting
        run: cargo fmt --check
      - name: Run standard tests
        run: cargo test --locked
      - name: Run tests without default features
        run: cargo test --locked --no-default-features
      - name: Run native feature tests
        run: cargo test --locked --features ${{ matrix.features }}
      - name: Check native features without default features
        run: cargo check --locked --all-targets --no-default-features --features ${{ matrix.features }}
