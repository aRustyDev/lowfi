# Keep the default pass on deterministic, frontend-neutral behavior. Native
# adapters have dedicated configurations because their compiled feature sets
# and test boundaries differ by platform.
examine_globs = [
    "src/player.rs",
    "src/config.rs",
    "src/ui/input.rs",
]
exclude_globs = [
    "packaging/**",
    "src/tests/**",
    "tests/**",
    "target/**",
]
# EventStream owns a terminal event loop and cannot be exercised without a
# terminal. `message_for` below it remains in scope.
exclude_re = ["listen", "Player::close"]
additional_cargo_args = ["--locked"]
test_tool = "nextest"
minimum_test_timeout = 20
timeout_multiplier = 5
