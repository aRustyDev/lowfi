[package]
name = "lowfi"
version = "2.0.7"
rust-version = "1.83.0"
edition = "2021"
description = "An extremely simple lofi player."
license = "MIT"
readme = "README.md"
categories = [
    "command-line-interface",
    "command-line-utilities",
    "multimedia",
    "multimedia::audio",
]
keywords = ["lowfi", "lofi", "music"]
documentation = "https://github.com/talwat/lowfi"
homepage = "https://github.com/talwat/lowfi"
repository = "https://github.com/talwat/lowfi"

[features]
default = ["default-tracklist"]
default-tracklist = []
mpris = ["dep:mpris-server", "dep:arc-swap"]
# Windows System Media Transport Controls (hardware media keys / overlay).
media-controls = ["dep:souvlaki", "dep:windows"]
menubar = ["dep:tao", "dep:tray-icon", "dep:objc2-media-player", "dep:resvg"]
extra-audio-formats = ["rodio/default"]
scrape = [
    "dep:serde_json",
    "dep:html-escape",
    "dep:scraper",
    "dep:indicatif",
]

[dependencies]
# Basics
clap = { version = "4.5.61", features = ["derive", "cargo"] }
eyre = "0.6.12"
fastrand = "2.4.1"
thiserror = "2.0.18"
figment = { version = "0.10.19", default-features = false, features = ["env", "toml"] }
serde = { version = "1.0.228", features = ["derive"] }

# Async
tokio = { version = "1.52.3", features = ["macros", "rt", "fs", "io-util", "sync", "time"], default-features = false }
futures-util = { version = "0.3.32", default-features = false }
arc-swap = { version = "1.9.1", optional = true }

# Data
reqwest = { version = "0.13.3", features = ["stream", "http2", "default-tls"], default-features = false }
chrono = { version = "0.4.45", features = ["clock"], default-features = false }
bytes = "1.12.0"

# I/O
crossterm = { version = "0.29.0", features = ["event-stream", "windows"], default-features = false }
rodio = { version = "0.22.2", features = ["symphonia-mp3", "playback"], default-features = false }
mpris-server = { version = "0.10.0", optional = true }
dirs = "6.0.0"

# Text processing
unicode-segmentation = "1.12.0"
url = { version = "2.5.8", default-features = false }

# Scraper
serde_json = { version = "1.0.150", optional = true }
scraper = { version = "0.27.0", optional = true }
html-escape = { version = "0.2.13", optional = true }
indicatif = { version = "0.18.4", optional = true }

[dev-dependencies]
mutants = "0.0.3"
figment = { version = "0.10.19", default-features = false, features = ["env", "toml", "test"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.186"

[target.'cfg(windows)'.dependencies]
souvlaki = { version = "0.8.3", optional = true, default-features = false }
windows = { version = "0.62", optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

[package.metadata.cargo-fc]
# Curated rows keep feature-gate coverage useful without expanding to the full
# powerset. `default` is explicit because cargo-fc otherwise begins each row
# with `--no-default-features`.
allow_feature_sets = [
    [],
    ["default"],
    ["scrape"],
    ["extra-audio-formats"],
    ["default", "scrape", "extra-audio-formats"],
]

[package.metadata.cargo-fc.target.'cfg(target_os = "linux")']
allow_feature_sets = [
    [],
    ["default"],
    ["scrape"],
    ["extra-audio-formats"],
    ["default", "scrape", "extra-audio-formats"],
    ["mpris"],
    ["default", "mpris"],
    ["mpris", "scrape", "extra-audio-formats"],
    ["default", "mpris", "scrape", "extra-audio-formats"],
]

[package.metadata.cargo-fc.target.'cfg(target_os = "windows")']
allow_feature_sets = [
    [],
    ["default"],
    ["scrape"],
    ["extra-audio-formats"],
    ["default", "scrape", "extra-audio-formats"],
    ["media-controls"],
    ["default", "media-controls"],
    ["media-controls", "scrape", "extra-audio-formats"],
    ["default", "media-controls", "scrape", "extra-audio-formats"],
]

[target.'cfg(target_os = "macos")'.dependencies]
tao = { version = "0.34.5", optional = true, default-features = false }
tray-icon = { version = "0.21.2", optional = true, default-features = false }
resvg = { version = "=0.45.1", optional = true, default-features = false }
objc2-media-player = { version = "0.3.2", optional = true, features = [
    "MPNowPlayingInfoCenter",
    "MPRemoteCommand",
    "MPRemoteCommandCenter",
    "MPRemoteCommandEvent",
] }

[package.metadata.cargo-fc.target.'cfg(target_os = "macos")']
allow_feature_sets = [
    [],
    ["default"],
    ["scrape"],
    ["extra-audio-formats"],
    ["default", "scrape", "extra-audio-formats"],
    ["menubar"],
    ["default", "menubar"],
]
